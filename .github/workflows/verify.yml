name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install development dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and build
        run: pnpm run check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Pack reviewed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
